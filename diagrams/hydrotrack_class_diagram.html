<style>
#cd svg .divider path { stroke-opacity: 0.5; }
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('cd-svg', `classDiagram
  class Channel {
    +int id
    +string name
    +int capacity
    +string status
    +Batch[] batches
  }
  class Batch {
    +int id
    +string cropType
    +Date plantedDate
    +Date expectedHarvestDate
    +string status
    +Channel channel
    +Reading[] readings
    +Harvest[] harvests
  }
  class Reading {
    +int id
    +Date date
    +float pH
    +float ec
    +float waterTemp
    +string notes
    +Batch batch
  }
  class Harvest {
    +int id
    +Date harvestDate
    +float yieldKg
    +string notes
    +Batch batch
  }
  class BatchService {
    +create(data) Batch
    +findAll() Batch[]
    +findById(id) Batch
    +update(id, data) Batch
    +delete(id) void
  }
  Channel "1" --> "many" Batch : hosts
  Batch "1" --> "many" Reading : has
  Batch "1" --> "many" Harvest : produces
  BatchService ..> Batch : manages`);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg .classGroup rect').forEach(r => r.setAttribute('rx', '8'));
</script>
